name: Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-release:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}

    steps:
      - name: Resolve release tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="${{ inputs.release_tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

  build-deb:
    needs: resolve-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set version from release tag
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)*$ ]]; then
            echo "Invalid SemVer release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          sed -i "s/^version = \".*\"/version = \"${version}\"/" Cargo.toml
          sed -i "/^name = \"machtop\"$/{n;s/^version = \".*\"/version = \"${version}\"/;}" Cargo.lock
          echo "Cargo.toml version set to ${version}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Install cargo-deb
        run: cargo install cargo-deb --version 3.7.0 --locked

      - name: Run tests
        run: cargo test --locked

      - name: Build Debian package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cargo deb --locked
          deb_path="$(find target/debian -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          if [[ -z "${deb_path}" ]]; then
            echo "No .deb package was produced" >&2
            exit 1
          fi
          sha_path="${deb_path}.sha256"
          sha256sum "${deb_path}" > "${sha_path}"
          echo "deb_path=${deb_path}" >> "${GITHUB_OUTPUT}"
          echo "sha_path=${sha_path}" >> "${GITHUB_OUTPUT}"

      - name: Smoke test Debian package install
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg -i "${{ steps.package.outputs.deb_path }}"
          dpkg -L machtop | grep -Fx '/usr/bin/machtop'
          set +e
          TERM=xterm timeout 2s script -qec "/usr/bin/machtop" /dev/null >/tmp/machtop-smoke.log 2>&1
          status=$?
          set -e
          if [[ "${status}" -ne 0 && "${status}" -ne 124 ]]; then
            cat /tmp/machtop-smoke.log >&2
            exit "${status}"
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-package-${{ matrix.arch }}
          path: |
            ${{ steps.package.outputs.deb_path }}
            ${{ steps.package.outputs.sha_path }}

  build-deb-arm64-bookworm:
    needs: resolve-release
    runs-on: ubuntu-24.04-arm
    container:
      image: rust:bookworm

    steps:
      - name: Install container dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y git dpkg-dev pkg-config

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set version from release tag
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)*$ ]]; then
            echo "Invalid SemVer release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          sed -i "s/^version = \".*\"/version = \"${version}\"/" Cargo.toml
          sed -i "/^name = \"machtop\"$/{n;s/^version = \".*\"/version = \"${version}\"/;}" Cargo.lock
          echo "Cargo.toml version set to ${version}"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb --version 3.7.0 --locked

      - name: Run tests
        run: cargo test --locked

      - name: Build Debian 12 compatible package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cargo deb --locked
          deb_path="$(find target/debian -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          if [[ -z "${deb_path}" ]]; then
            echo "No .deb package was produced" >&2
            exit 1
          fi
          compat_deb_path="${deb_path%.deb}_bookworm.deb"
          mv "${deb_path}" "${compat_deb_path}"
          sha_path="${compat_deb_path}.sha256"
          sha256sum "${compat_deb_path}" > "${sha_path}"
          echo "deb_path=${compat_deb_path}" >> "${GITHUB_OUTPUT}"
          echo "sha_path=${sha_path}" >> "${GITHUB_OUTPUT}"

      - name: Smoke test Debian package install
        shell: bash
        run: |
          set -euo pipefail
          dpkg -i "${{ steps.package.outputs.deb_path }}"
          dpkg -L machtop | grep -Fx '/usr/bin/machtop'
          set +e
          TERM=xterm timeout 2s script -qec "/usr/bin/machtop" /dev/null >/tmp/machtop-smoke.log 2>&1
          status=$?
          set -e
          if [[ "${status}" -ne 0 && "${status}" -ne 124 ]]; then
            cat /tmp/machtop-smoke.log >&2
            exit "${status}"
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-package-arm64-bookworm
          path: |
            ${{ steps.package.outputs.deb_path }}
            ${{ steps.package.outputs.sha_path }}

  build-arch:
    needs: resolve-release
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest

    steps:
      - name: Install container dependencies
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel rust pkgconf git sudo

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set version from release tag
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)*$ ]]; then
            echo "Invalid SemVer release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          sed -i "s/^version = \".*\"/version = \"${version}\"/" Cargo.toml
          sed -i "/^name = \"machtop\"$/{n;s/^version = \".*\"/version = \"${version}\"/;}" Cargo.lock
          echo "Cargo.toml version set to ${version}"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build Arch package
        id: package
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"

          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          cat > PKGBUILD << EOF
          pkgname=machtop
          pkgver=${version}
          pkgrel=1
          pkgdesc="A compact Linux TUI system monitor with CPU, thermal, GPU, and NPU metrics"
          arch=('x86_64')
          url="https://github.com/ClayStan404/machtop"
          license=('GPL3')
          depends=('gcc-libs')
          source=()
          sha256sums=()

          package() {
            install -Dm755 "\$startdir/target/release/machtop" "\$pkgdir/usr/bin/machtop"
            install -Dm644 "\$startdir/README.md" "\$pkgdir/usr/share/doc/machtop/README.md"
            install -Dm644 "\$startdir/LICENSE" "\$pkgdir/usr/share/doc/machtop/LICENSE"
          }
          EOF

          chown -R builduser:builduser "$(pwd)"
          sudo -u builduser makepkg --nodeps --skipinteg --noconfirm -f

          pkg_path="$(find "$(pwd)" -maxdepth 1 -type f -name '*.pkg.tar.zst' | head -n 1)"
          if [[ -z "${pkg_path}" ]]; then
            echo "No .pkg.tar.zst package was produced" >&2
            exit 1
          fi
          sha_path="${pkg_path}.sha256"
          sha256sum "${pkg_path}" > "${sha_path}"
          echo "pkg_path=${pkg_path}" >> "${GITHUB_OUTPUT}"
          echo "sha_path=${sha_path}" >> "${GITHUB_OUTPUT}"

      - name: Smoke test Arch package install
        shell: bash
        run: |
          set -euo pipefail
          pacman -U --noconfirm "${{ steps.package.outputs.pkg_path }}"
          pacman -Qq machtop >/dev/null
          test -x /usr/bin/machtop
          set +e
          TERM=xterm timeout 2s script -qec "/usr/bin/machtop" /dev/null >/tmp/machtop-smoke.log 2>&1
          status=$?
          set -e
          if [[ "${status}" -ne 0 && "${status}" -ne 124 ]]; then
            cat /tmp/machtop-smoke.log >&2
            exit "${status}"
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arch-package-x86_64
          path: |
            ${{ steps.package.outputs.pkg_path }}
            ${{ steps.package.outputs.sha_path }}

  publish-release:
    needs:
      - resolve-release
      - build-deb
      - build-deb-arm64-bookworm
      - build-arch
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: "*-package-*"
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            release-artifacts/*.deb
            release-artifacts/*.pkg.tar.zst
            release-artifacts/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
